name: Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Compile Python modules
        run: >-
          python -m py_compile product_generator_gui.py listing_store.py
          __main__.py

      # Ohne X-Server kann Tk kein Fenster oeffnen; die GUI-Tests wuerden sich
      # sonst stillschweigend ueberspringen statt zu pruefen.
      - name: Install virtual framebuffer
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run tests
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest -v

      - name: Run tests
        if: runner.os != 'Linux'
        run: python -m unittest -v

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install project and pip-audit
        run: python -m pip install --upgrade pip && python -m pip install . pip-audit

      - name: Audit Python dependencies
        run: python -m pip_audit

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
