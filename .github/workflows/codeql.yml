name: CodeQL

# Statische Sicherheitsanalyse von GitHub. Die Ergebnisse erscheinen im Tab
# "Security" und sind damit fuer Nutzer des Projekts nachvollziehbar - anders
# als eine blosse Selbstauskunft in der Dokumentation.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Woechentlich, damit auch neu bekannt gewordene Muster greifen.
    - cron: '17 4 * * 1'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyse
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      # Die Action liest Angaben zum eigenen Lauf; ohne diese Berechtigung
      # meldet sie "Resource not accessible by integration" und der Job faellt,
      # obwohl die Analyse selbst durchgelaufen ist.
      actions: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          # security-and-quality meldet zusaetzlich Wartbarkeitsmuster.
          queries: security-and-quality

      - name: Run analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:python
