[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ebay-kleinanzeigen-creationtool"
version = "0.3.0"
description = "GUI-Tool zur Erstellung prüfbarer Produktbeschreibungen für eBay und Kleinanzeigen mit festem Privatverkaufs-Hinweis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0", "keyring>=25.0"]
license = {text = "MIT"}
authors = [
    {name = "Michael"}
]
keywords = ["ebay", "kleinanzeigen", "produktbeschreibung", "generator", "gui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Utilities",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://github.com/pcblizzard/eBay-Kleinanzeigen-Creationtool"
Repository = "https://github.com/pcblizzard/eBay-Kleinanzeigen-Creationtool.git"
"Bug Tracker" = "https://github.com/pcblizzard/eBay-Kleinanzeigen-Creationtool/issues"

[tool.setuptools]
py-modules = ["product_generator_gui", "listing_store"]

# Die Produktdatenbank muss mitinstalliert werden, sonst startet das
# Konsolenskript ohne lokale Treffer. Der Pfad wird von
# product_generator_gui.default_products_file() gesucht.
[tool.setuptools.data-files]
"share/ebay-creationtool" = ["products.json"]

[project.scripts]
ebay-creationtool = "product_generator_gui:main"
