[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ebay-kleinanzeigen-creationtool"
version = "0.1.0"
description = "GUI-Tool zur automatischen Erstellung von Produktbeschreibungen für eBay und Kleinanzeigen mit rechtssicherer Gewährleistungsklausel"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Michael", email = "michael@example.com"}
]
keywords = ["ebay", "kleinanzeigen", "produktbeschreibung", "generator", "gui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Utilities",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://github.com/yourusername/eBay_Kleinanzeigen"
Repository = "https://github.com/yourusername/eBay_Kleinanzeigen.git"
"Bug Tracker" = "https://github.com/yourusername/eBay_Kleinanzeigen/issues"

[tool.setuptools]
packages = ["product_generator"]

[project.scripts]
ebay-creationtool = "product_generator_gui:main"
